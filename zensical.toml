# Zensical config — Phil Harrison / OpenAfterHours
# Docs: https://zensical.org/docs/

[project]

site_name = "Phil Harrison · OpenAfterHours"
site_description = "I learn things by building them. Open-source Python tooling, a Basel 3.1 risk engine and a session planner for swimming clubs — built after the day job, mostly alongside a swarm of coding agents."
site_author = "Phil Harrison"
site_url = "https://shipsafterhours.github.io/ShipsAfterHours/"

copyright = """
&copy; 2026 · <b>OpenAfterHours</b>
"""

# Stylesheets are layered on top of Zensical's defaults.
# Paths are relative to docs_dir.
extra_css = [
  "stylesheets/colors_and_type.css",
  "stylesheets/page.css",
  "stylesheets/terminal.css",
]

# Explicit nav — the site is a single page.
nav = [
  { "Home" = "index.md" },
]

[project.theme]

# Custom templates live in ./overrides — index.md renders through
# home.html, which is the whole site.
custom_dir = "overrides"

favicon = "images/openafterhours_icon_512.png"
language = "en"

# Trim Zensical's stock features for a personal site — keep search,
# instant nav, and code copy; drop announcement bar, breadcrumbs, etc.
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "search.highlight",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# The page beneath the terminal follows the visitor system preference.
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Sensible Markdown extensions.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tilde]
